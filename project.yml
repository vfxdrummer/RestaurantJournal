name: RestaurantJournal
options:
  bundleIdPrefix: com.vfxdrummer
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: CC8YN337SX
    SWIFT_VERSION: "5.0"
targets:
  RestaurantJournal:
    type: application
    platform: iOS
    sources:
      # The whole app folder is included (so new files — e.g. PrivacyInfo.xcprivacy — are picked up
      # automatically). Info.plist + entitlements are referenced by build settings, not bundled.
      - path: RestaurantJournal
        excludes:
          - Info.plist
          - RestaurantJournal.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vfxdrummer.RestaurantJournal
        PRODUCT_NAME: RestaurantJournal
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "18"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: RestaurantJournal/Info.plist
        CODE_SIGN_ENTITLEMENTS: RestaurantJournal/RestaurantJournal.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app-wide tint (yellow) comes from the AccentColor asset — restores it app-wide.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Generates the SwiftUI asset symbols the code uses (.accent, Color(.brandGreen), etc.).
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG CARD_LINKING ASK_FEATURE
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: ""
